  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.6)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ---------------------------------------------------------- esperar la fuente y muestrear la palabra */
await document.fonts.load('700 100px "Balimo"');
await document.fonts.ready;

function sampleWord() {
  const W = 1800, H = 460;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });

  let fs = 350;
  ctx.font = `700 ${fs}px "Balimo"`;
  const measured = ctx.measureText(WORD).width;
  fs = fs * (W * 0.90) / measured;
  ctx.font = `700 ${fs}px "Balimo"`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff';
  ctx.fillText(WORD, W / 2, H / 2);

  const data = ctx.getImageData(0, 0, W, H).data;
  const pts = [];
  for (let y = 0; y < H; y += GAP) {
    const yi = Math.floor(y);
    for (let x = 0; x < W; x += GAP) {
      const xi = Math.floor(x);
      if (data[(yi * W + xi) * 4 + 3] > 127) {
        pts.push(
          x + (Math.random() - 0.5) * GAP * 0.55,
          y + (Math.random() - 0.5) * GAP * 0.55
        );
      }
    }
  }
  return { pts, W, H };
}

/* ---------------------------------------------------------- setup three */
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 1);
renderer.domElement.classList.add('webgl');
document.body.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 4.9);

/* ---------------------------------------------------------- construir partículas */
let TOTAL, home, pos, vel, colBase, col, aSize, aRand, scatterW;
let geo, points;
const tmpColor = new THREE.Color();
let wordScale = 1, wordH = 1;

const mat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:    { value: 0 },
    uTexture: { value: makeSprite() },
    uScale:   { value: 1 },
  },
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute float aRand;
    varying vec3 vColor;
    uniform float uTime;
    uniform float uScale;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float pulse = 0.85 + 0.15 * sin(uTime * 1.6 + aRand * 6.2831);
      float ps = aSize * pulse * uScale / -mv.z;
      gl_PointSize = min(ps, 40.0);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D uTexture;
    varying vec3 vColor;
    void main() {
      vec4 tex = texture2D(uTexture, gl_PointCoord);
      if (tex.a < 0.02) discard;
      gl_FragColor = vec4(vColor, tex.a);
    }
  `,
  vertexColors: true,
  transparent: true,
  depthWrite: false,
  depthTest: false,
  blending: THREE.AdditiveBlending,
});

function build() {
  const { pts, W, H } = sampleWord();
  const letterCount = pts.length / 2;
  TOTAL = letterCount + DUST;

  /* escala: la palabra ocupa ~88% del ancho visible */
  const visH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
  const visW = visH * camera.aspect;
  const fit  = Math.min(visW * 0.88, visH * 3.4) / W;
  wordScale  = fit;
  wordH      = H * fit;

  home     = new Float32Array(TOTAL * 3);
  pos      = new Float32Array(TOTAL * 3);
  vel      = new Float32Array(TOTAL * 3);
  colBase  = new Float32Array(TOTAL * 3);
  col      = new Float32Array(TOTAL * 3);
  aSize    = new Float32Array(TOTAL);
  aRand    = new Float32Array(TOTAL);
  scatterW = new Float32Array(TOTAL);

  const centerY = H * 0.52;

  for (let i = 0; i < letterCount; i++) {
    const px = pts[i * 2], py = pts[i * 2 + 1];
    const wx = (px - W / 2) * fit;
    const wy = (centerY - py) * fit;
    home[i*3] = wx; home[i*3+1] = wy; home[i*3+2] = 0;

    /* espectro cálido: hsl 0.01–0.10, luminancia por altura dentro de la palabra */
    const v = THREE.MathUtils.clamp(wy / (wordH * 0.5) * 0.5 + 0.5, 0, 1);
    const hue = 0.012 + Math.random() * 0.085;
    const lum = 0.5 + v * 0.22;
    tmpColor.setHSL(hue, 1.0, lum);
    colBase[i*3] = tmpColor.r; colBase[i*3+1] = tmpColor.g; colBase[i*3+2] = tmpColor.b;

    aSize[i] = 0.8 + Math.random() * 0.4;
    aRand[i] = Math.random();
    scatterW[i] = 0.8 + Math.random() * 0.55;
  }

  /* polvo frío disperso alrededor */
  for (let i = letterCount; i < TOTAL; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 2.6 + Math.random() * 2.2;
    home[i*3]   = Math.cos(a) * r * (0.9 + camera.aspect * 0.35);
    home[i*3+1] = Math.sin(a) * r * 0.55;
    home[i*3+2] = 0;

    tmpColor.setHSL(0.6, 0.75, 0.42 + Math.random() * 0.18);
    colBase[i*3] = tmpColor.r; colBase[i*3+1] = tmpColor.g; colBase[i*3+2] = tmpColor.b;

    aSize[i] = 0.28 + Math.random() * 0.4;
    aRand[i] = Math.random();
    scatterW[i] = 1.6 + Math.random() * 1.2;
  }

  pos.set(home);
  col.set(colBase);

  if (points) { scene.remove(points); geo.dispose(); }
  geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(aSize, 1));
  geo.setAttribute('aRand',    new THREE.BufferAttribute(aRand, 1));
  points = new THREE.Points(geo, mat);
  scene.add(points);

  /* tamaño de punto: diámetro ≈ paso de muestreo en mundo → las letras se leen sólidas */
  const worldDot = GAP * fit * 1.85;
  const hPx = window.innerHeight * renderer.getPixelRatio();
  mat.uniforms.uScale.value = worldDot * (hPx * 0.5) / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));

  document.getElementById('counter').textContent = TOTAL.toLocaleString('es-ES') + ' puntos';
}
build();

/* ---------------------------------------------------------- puntero → plano z=0 */
const ndc = new THREE.Vector2(10, 10);
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const mouse3 = new THREE.Vector3(999, 999, 0);
let pointerActive = false;

function onMove(x, y) {
  ndc.x =  (x / window.innerWidth)  * 2 - 1;
  ndc.y = -(y / window.innerHeight) * 2 + 1;
  pointerActive = true;
}
window.addEventListener('pointermove', e => onMove(e.clientX, e.clientY), { passive: true });
window.addEventListener('pointerdown', e => onMove(e.clientX, e.clientY), { passive: true });
window.addEventListener('pointerleave', () => { pointerActive = false; });
window.addEventListener('blur', () => { pointerActive = false; });

/* ---------------------------------------------------------- física */
const SPRING  = 0.024;   // retorno a la letra
const DAMPING = 0.90;    // rebote elástico
const REPEL_R = 0.95;    // radio de influencia del cursor
const REPEL_F = 1.15;    // fuerza de desarme

const HOT = { r: 1.0, g: 0.93, b: 0.78 }; // blanco cálido al desarmarse

let t = 0;
const clock = new THREE.Clock();

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  if (pointerActive) {
    raycaster.setFromCamera(ndc, camera);
    raycaster.ray.intersectPlane(plane, mouse3);
  }

  const mX = mouse3.x, mY = mouse3.y;
  const r2 = REPEL_R * REPEL_R;

  for (let i = 0; i < TOTAL; i++) {
    const ix = i * 3, iy = ix + 1, iz = ix + 2;
    const tx = home[ix], ty = home[iy];

    let px = pos[ix], py = pos[iy];
    let vx = vel[ix], vy = vel[iy];

    /* muelle hacia la letra */
    vx += (tx - px) * SPRING;
    vy += (ty - py) * SPRING;

    /* repulsión del cursor — desarma la palabra */
    if (pointerActive) {
      const dx = px - mX, dy = py - mY;
      const d2 = dx*dx + dy*dy;
      if (d2 < r2 && d2 > 1e-6) {
        const d = Math.sqrt(d2);
        const f = (1 - d / REPEL_R);
        const push = f * f * REPEL_F * scatterW[i] / d;
        const rnd = aRand[i] * 6.2831 + t * 3.0;
        vx += dx * push + Math.sin(rnd)       * f * 0.10 * scatterW[i];
        vy += dy * push + Math.cos(rnd * 1.3) * f * 0.10 * scatterW[i];
      }
    }

    vx *= DAMPING; vy *= DAMPING;
    px += vx; py += vy;

    pos[ix] = px; pos[iy] = py;
    vel[ix] = vx; vel[iy] = vy;

    /* color: cuanto más lejos de su letra, más caliente */
    const ex = px - tx, ey = py - ty;
    const disp = Math.sqrt(ex*ex + ey*ey);
    const hot = Math.min(disp * 1.5, 1);
    const br = colBase[ix], bg = colBase[iy], bb = colBase[iz];
    col[ix] = br + (HOT.r - br) * hot;
    col[iy] = bg + (HOT.g - bg) * hot;
    col[iz] = bb + (HOT.b - bb) * hot;
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;

  mat.uniforms.uTime.value = t;
  renderer.render(scene, camera);
}
tick();

/* ---------------------------------------------------------- resize */
let resizeTimer;
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(build, 180);
});
</script>
</body>
</html>
